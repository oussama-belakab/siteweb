<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ملفات متنوعة - الأستاذ بلعقاب أسامة</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/features.css">
  <script src="js/app-api.js" defer></script>
</head>
<body>

  <div class="page-container">
    
    <!-- 🎯 شريط العنوان العلوي -->
    <header class="subpage-header">
      <div class="subpage-header-right">
        <a href="index.html" class="back-btn" title="الرجوع للرئيسية">
          <i class="fa-solid fa-arrow-right"></i>
        </a>
        <div class="subpage-title-box">
          <h1>📁 ملفات ومستندات متنوعة</h1>
          <p>مطابقة لقسم الملفات في بوت تيليغرام مباشرة من قاعدة بيانات Turso</p>
        </div>
      </div>
      <span class="subpage-badge">ملفات ومجلدات</span>
    </header>

    <!-- شريط تنبيه للزوار غير المسجلين -->
    <div id="guestWarningBanner" style="display:none; width:100%; margin-bottom: 20px; background: #fffbeb; border: 1px solid #fcd34d; color: #92400e; padding: 12px 18px; border-radius: 16px; font-weight: 700; font-size: 0.9rem; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <i class="fa-solid fa-lock" style="color:#d97706; font-size:1.1rem;"></i>
        <span>أنت تتصفح كزائر. لتحميل ملفات ومذكرات الأستاذ بلعقاب أسامة يرجى تسجيل الدخول.</span>
      </div>
      <a href="login.html" style="background:#d97706; color:#fff; text-decoration:none; padding:6px 14px; border-radius:10px; font-size:0.82rem; font-weight:800;">تسجيل الدخول</a>
    </div>

    <!-- 🎯 شبكة المجلدات والملفات -->
    <div class="items-grid" id="filesGrid">
      <div class="empty-state">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <p>جاري جلب الملفات من قاعدة البيانات...</p>
      </div>
    </div>

  </div>

  <!-- 🎯 شريط التنقل السفلي -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <i class="fa-solid fa-house"></i>
      <span>الرئيسية</span>
    </a>
    <a href="lessons.html" class="nav-item">
      <i class="fa-solid fa-book-open"></i>
      <span>الدروس</span>
    </a>
    <a href="exercises.html" class="nav-item">
      <i class="fa-solid fa-pen-to-square"></i>
      <span>التمارين</span>
    </a>
    <a href="homework.html" class="nav-item">
      <i class="fa-solid fa-file-arrow-up"></i>
      <span>الواجبات</span>
    </a>
    <a href="profile.html" class="nav-item">
      <i class="fa-solid fa-user"></i>
      <span>حسابي</span>
    </a>
  </nav>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const container = document.getElementById("filesGrid");
      const guestBanner = document.getElementById("guestWarningBanner");
      if (guestBanner && !window.AppAPI.isLoggedIn()) {
        guestBanner.style.display = "flex";
      }
      try {
        const res = await fetch(`${(window.location.protocol.startsWith("http")) ? "" : "http://localhost:5000"}/api/files`);
        const files = res.ok ? await res.json() : [];

        if (!files || files.length === 0) {
          container.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1;">
              <i class="fa-solid fa-folder-open"></i>
              <h3>لا توجد ملفات إضافية حالياً</h3>
              <p>الملفات المضافة من قبل الأستاذ في تيليغرام تظهر هنا مباشرة عبر Turso.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = files.map(f => `
          <div class="feature-card">
            <div>
              <div class="card-top">
                <span class="card-unit-badge"><i class="fa-solid fa-folder"></i> ${f.folder_name || 'ملفات عامة'}</span>
                <span class="card-status-badge active"><i class="fa-solid fa-file"></i> ${f.file_type || 'PDF'}</span>
              </div>
              <h3 class="card-title">${f.title}</h3>
              <p class="card-desc">مستند تعليمي إضافي متوفر للتحميل المباشر.</p>
            </div>
            <div class="card-actions">
              <button onclick="window.AppAPI.openProtectedFile('${f.url || ('/api/media/' + f.file_id)}', '${f.title}')" class="btn-primary-action" style="cursor:pointer; border:none; width:100%;">
                <i class="fa-solid fa-download"></i> تحميل الملف
              </button>
            </div>
          </div>
        `).join("");
      } catch (err) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <i class="fa-solid fa-circle-exclamation"></i>
            <h3>حدث خطأ أثناء تحميل الملفات</h3>
            <p>تأكد من تشغيل خادم المنصة web_server.py والاتصال بـ Turso.</p>
          </div>
        `;
      }
    });
  </script>

</body>
</html>
