<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معاينة الملف - الأستاذ بلعقاب أسامة</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="js/pdf.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    /* شريط الأدوات العلوي */
    .viewer-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #1e1b4b;
      border-bottom: 1.5px solid rgba(112, 51, 255, 0.4);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .viewer-title {
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-tool {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 7px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-tool:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: translateY(-1px);
    }
    .zoom-controls {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 12px;
      padding: 3px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .zoom-btn {
      background: none;
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      transition: background 0.15s;
    }
    .zoom-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .zoom-label {
      min-width: 55px;
      text-align: center;
      font-weight: 800;
      font-size: 0.82rem;
      color: #ffb703;
      user-select: none;
    }

    /* منطقة عرض الصفحات */
    .viewer-container {
      flex: 1;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      overflow-y: auto;
    }
    .page-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: width 0.2s ease;
    }
    .page-badge {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .page-canvas {
      width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.45);
      background: #fff;
    }
    .image-preview {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.45);
    }

    /* حالة التحميل والخطأ */
    .loading-box {
      text-align: center;
      padding: 80px 20px;
      color: #94a3b8;
    }
    .loading-box i {
      font-size: 2.5rem;
      color: #ffb703;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <!-- شريط الأدوات -->
  <header class="viewer-header">
    <div class="header-right">
      <button onclick="window.history.length > 1 ? window.history.back() : window.close()" class="btn-tool" title="رجوع">
        <i class="fa-solid fa-arrow-right"></i>
        <span>رجوع</span>
      </button>
      <div class="viewer-title">
        <i class="fa-solid fa-file-pdf" style="color:#ffb703;"></i>
        <span id="docTitle">جاري تحميل المستند...</span>
      </div>
    </div>

    <div class="header-left">
      <!-- أدوات التكبير والتصغير -->
      <div class="zoom-controls">
        <button class="zoom-btn" onclick="adjustZoom(-0.15)" title="تصغير (-)">
          <i class="fa-solid fa-minus"></i>
        </button>
        <span class="zoom-label" id="zoomText">85%</span>
        <button class="zoom-btn" onclick="adjustZoom(0.15)" title="تكبير (+)">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>

      <button class="btn-tool" onclick="resetZoom(0.85)" title="الحجم الافتراضي">
        <i class="fa-solid fa-compress"></i> <span>افتراضي</span>
      </button>

      <button class="btn-tool" onclick="toggleFullScreen()" title="ملء الشاشة">
        <i class="fa-solid fa-expand"></i>
      </button>
    </div>
  </header>

  <!-- مساحة العرض -->
  <main class="viewer-container" id="viewerContainer">
    <div class="loading-box" id="loadingBox">
      <i class="fa-solid fa-spinner fa-spin"></i>
      <p style="font-weight:700; font-size:1rem; color:#fff;">جاري قراءة وتجهيز صفحات الملف بدقة عالية...</p>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const fileUrl = params.get('file');
    const fileTitle = params.get('title') || 'معاينة الملف';

    document.getElementById('docTitle').innerText = fileTitle;
    document.title = fileTitle + " - الأستاذ بلعقاب أسامة";

    let currentScale = 0.85; // مقياس مريح ومناسب بحيث لا يظهر قريباً جداً
    let loadedPdf = null;
    let pageViewports = [];
    let canvases = [];

    async function loadDocument() {
      if (!fileUrl) {
        document.getElementById('loadingBox').innerHTML = `
          <i class="fa-solid fa-triangle-exclamation" style="color:#ef4444;"></i>
          <p style="color:#fca5a5;">لم يتم تحديد رابط الملف المراد عرضه.</p>
        `;
        return;
      }

      try {
        const res = await fetch(fileUrl);
        if (!res.ok) throw new Error("Status " + res.status);
        const ct = (res.headers.get("Content-Type") || "").toLowerCase();
        const arrayBuffer = await res.arrayBuffer();

        const isPdf = ct.includes("pdf") || (arrayBuffer.byteLength >= 4 && new Uint8Array(arrayBuffer.slice(0, 4)).reduce((acc, b) => acc + String.fromCharCode(b), '') === "%PDF");

        const container = document.getElementById('viewerContainer');
        container.innerHTML = "";

        if (isPdf) {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = "js/pdf.worker.min.js";
          loadedPdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          await renderPdfPages();
        } else {
          // عرض كصورة
          const blob = new Blob([arrayBuffer], { type: ct || "image/jpeg" });
          const blobUrl = URL.createObjectURL(blob);
          const img = document.createElement("img");
          img.className = "image-preview";
          img.src = blobUrl;
          img.id = "imageTarget";
          img.style.maxWidth = `${Math.round(currentScale * 100)}%`;
          container.appendChild(img);
        }
      } catch (err) {
        console.error("Load error:", err);
        document.getElementById('viewerContainer').innerHTML = `
          <div class="loading-box">
            <i class="fa-solid fa-triangle-exclamation" style="color:#ef4444;"></i>
            <p style="color:#fca5a5; font-weight:800; font-size:1.1rem; margin-bottom:8px;">تعذر فتح الملف مباشرة</p>
            <p style="font-size:0.88rem; color:#94a3b8;">يرجى التأكد من اتصالك بالإنترنت أو إعادة المحاولة.</p>
          </div>
        `;
      }
    }

    async function renderPdfPages() {
      const container = document.getElementById('viewerContainer');
      container.innerHTML = "";
      canvases = [];
      pageViewports = [];

      // حجم عرض الصفحة الافتراضي المريح (مثلاً 720px إلى 780px حسب مقياس currentScale)
      const baseWidth = Math.min(820, window.innerWidth - 40);
      const targetWidth = baseWidth * currentScale;

      for (let pageNum = 1; pageNum <= loadedPdf.numPages; pageNum++) {
        const page = await loadedPdf.getPage(pageNum);
        const unscaled = page.getViewport({ scale: 1.0 });
        const scale = (targetWidth / unscaled.width) * 1.5; // مضاعفة الدقة للوضوح
        const viewport = page.getViewport({ scale: scale });

        const card = document.createElement("div");
        card.className = "page-card";
        card.style.width = `${targetWidth}px`;

        if (loadedPdf.numPages > 1) {
          const badge = document.createElement("div");
          badge.className = "page-badge";
          badge.innerText = `الصفحة ${pageNum} من ${loadedPdf.numPages}`;
          card.appendChild(badge);
        }

        const canvas = document.createElement("canvas");
        canvas.className = "page-canvas";
        canvas.width = viewport.width;
        canvas.height = viewport.height;

        const ctx = canvas.getContext("2d");
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;

        card.appendChild(canvas);
        container.appendChild(card);
        canvases.push({ card, canvas, page, unscaled });
      }

      updateZoomDisplay();
    }

    function adjustZoom(delta) {
      const newScale = Math.min(1.6, Math.max(0.45, currentScale + delta));
      if (Math.abs(newScale - currentScale) < 0.01) return;
      currentScale = newScale;

      const img = document.getElementById("imageTarget");
      if (img) {
        img.style.maxWidth = `${Math.round(currentScale * 100)}%`;
        updateZoomDisplay();
        return;
      }

      const baseWidth = Math.min(820, window.innerWidth - 40);
      const targetWidth = baseWidth * currentScale;
      canvases.forEach(item => {
        item.card.style.width = `${targetWidth}px`;
      });
      updateZoomDisplay();
    }

    function resetZoom(val = 0.85) {
      currentScale = val;
      adjustZoom(0);
    }

    function updateZoomDisplay() {
      document.getElementById('zoomText').innerText = `${Math.round(currentScale * 100)}%`;
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(()=>{});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // تشغيل عند تحميل الصفحة
    document.addEventListener("DOMContentLoaded", loadDocument);
  </script>

</body>
</html>
