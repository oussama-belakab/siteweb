<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Icons</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

body{

background:#f5f7fb;

font-family:Cairo;

padding:40px;

display:grid;

grid-template-columns:repeat(auto-fill,minmax(150px,1fr));

gap:25px;

}

.icon{

background:white;

padding:25px;

border-radius:15px;

text-align:center;

box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.icon i{

font-size:45px;

color:#1565C0;

margin-bottom:15px;

}

</style>

</head>

<body>

<div class="icon">
<i class="fa-solid fa-house"></i>
<p>الرئيسية</p>
</div>

</div>
