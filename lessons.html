<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الدروس والمحاضرات - الأستاذ بلعقاب أسامة</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/features.css">
  <script src="js/app-api.js" defer></script>
</head>
<body>

  <div class="page-container">
    
    <!-- 🎯 شريط العنوان العلوي -->
    <header class="subpage-header">
      <div class="subpage-header-right">
        <a href="index.html" class="back-btn" title="الرجوع للرئيسية">
          <i class="fa-solid fa-arrow-right"></i>
        </a>
        <div class="subpage-title-box">
          <h1>📘 دروس الرياضيات</h1>
          <p>شروحات مفصلة، ملخصات مركزة وقوانين شاملة</p>
        </div>
      </div>
      <span class="subpage-badge">BAC 2027</span>
    </header>

    <!-- 🎯 شريط البحث والتصفية -->
    <div class="search-filter-bar">
      <!-- شريط تنبيه للزوار غير المسجلين -->
      <div id="guestWarningBanner" style="display:none; width:100%; margin-bottom: 12px; background: #fffbeb; border: 1px solid #fcd34d; color: #92400e; padding: 10px 16px; border-radius: 14px; font-weight: 700; font-size: 0.88rem; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <i class="fa-solid fa-lock" style="color:#d97706; font-size:1.1rem;"></i>
          <span>أنت تتصفح كزائر. لمشاهدة شروحات الدروس وتحميل الملخصات يرجى تسجيل الدخول.</span>
        </div>
        <a href="login.html" style="background:#d97706; color:#fff; text-decoration:none; padding:5px 12px; border-radius:10px; font-size:0.82rem; font-weight:800;">تسجيل الدخول</a>
      </div>

      <div class="search-input-wrapper">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="lessonSearchInput" placeholder="ابحث عن درس، فكرة، أو قاعدة رياضية...">
      </div>

      <!-- أشرطة الوحدات -->
      <div class="units-scroll" id="unitsTabs">
        <button class="unit-pill active" data-unit="all">
          <i class="fa-solid fa-layer-group"></i> كل الوحدات
        </button>
        <!-- سيتم توليد الوحدات ديناميكياً من app-api.js -->
      </div>
    </div>

    <!-- 🎯 شبكة الدروس -->
    <div class="items-grid" id="lessonsGrid">
      <!-- تحميل الدروس عبر الجافاسكريبت -->
      <div class="empty-state">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <p>جاري تحميل الدروس...</p>
      </div>
    </div>

  </div>

  <!-- 🎯 شريط التنقل السفلي -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <i class="fa-solid fa-house"></i>
      <span>الرئيسية</span>
    </a>
    <a href="lessons.html" class="nav-item active">
      <i class="fa-solid fa-book-open"></i>
      <span>الدروس</span>
    </a>
    <a href="exercises.html" class="nav-item">
      <i class="fa-solid fa-pen-to-square"></i>
      <span>التمارين</span>
    </a>
    <a href="homework.html" class="nav-item">
      <i class="fa-solid fa-file-arrow-up"></i>
      <span>الواجبات</span>
    </a>
    <a href="profile.html" class="nav-item">
      <i class="fa-solid fa-user"></i>
      <span>حسابي</span>
    </a>
  </nav>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const unitsTabsContainer = document.getElementById("unitsTabs");
      const lessonsGrid = document.getElementById("lessonsGrid");
      const searchInput = document.getElementById("lessonSearchInput");
      const guestBanner = document.getElementById("guestWarningBanner");

      if (guestBanner && !window.AppAPI.isLoggedIn()) {
        guestBanner.style.display = "flex";
      }

      let allLessons = [];
      let currentUnit = "all";

      // 1. تحميل الوحدات
      const units = await window.AppAPI.getUnits();
      units.forEach(u => {
        const btn = document.createElement("button");
        btn.className = "unit-pill";
        btn.dataset.unit = u.id;
        btn.innerHTML = `${u.name}`;
        btn.addEventListener("click", () => {
          document.querySelectorAll(".unit-pill").forEach(p => p.classList.remove("active"));
          btn.classList.add("active");
          currentUnit = u.id;
          renderLessons();
        });
        unitsTabsContainer.appendChild(btn);
      });

      // زر "كل الوحدات"
      document.querySelector('[data-unit="all"]').addEventListener("click", (e) => {
        document.querySelectorAll(".unit-pill").forEach(p => p.classList.remove("active"));
        e.currentTarget.classList.add("active");
        currentUnit = "all";
        renderLessons();
      });

      // 2. تحميل الدروس
      allLessons = await window.AppAPI.getLessons();
      renderLessons();

      // البحث المباشر
      searchInput.addEventListener("input", () => {
        renderLessons();
      });

      // استخراج رقم الدرس من العنوان للترتيب التلقائي
      function extractNumber(title) {
        const m = title.match(/(\d+)/);
        return m ? parseInt(m[1], 10) : 9999;
      }

      function renderLessons() {
        const q = searchInput.value.trim().toLowerCase();
        let filtered = [...allLessons];

        if (currentUnit !== "all") {
          filtered = filtered.filter(l => l.unit_id == currentUnit);
        }

        if (q) {
          filtered = filtered.filter(l => 
            l.title.toLowerCase().includes(q) || 
            (l.desc && l.desc.toLowerCase().includes(q)) ||
            (l.unit_name && l.unit_name.toLowerCase().includes(q))
          );
        }

        // ترتيب الدروس حسب الرقم المستخرج من العنوان تلقائياً
        filtered.sort((a, b) => extractNumber(a.title) - extractNumber(b.title));

        if (filtered.length === 0) {
          lessonsGrid.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1;">
              <i class="fa-solid fa-folder-open"></i>
              <h3>لا توجد دروس مطابقة</h3>
              <p>حاول البحث بكلمة أخرى أو اختيار وحدة تعليمية أخرى.</p>
            </div>
          `;
          return;
        }

        lessonsGrid.innerHTML = filtered.map(lesson => `
          <div class="feature-card">
            <div>
              <div class="card-top">
                <span class="card-unit-badge"><i class="fa-solid fa-bookmark"></i> ${lesson.unit_name || 'رياضيات'}</span>
                <span class="card-status-badge active"><i class="fa-solid fa-file-pdf"></i> ملف PDF</span>
              </div>
              <h3 class="card-title">${lesson.title}</h3>
              <p class="card-desc">${lesson.desc || 'درس وشرح أفكار المنهجية بالتفصيل.'}</p>
            </div>
            <div class="card-actions">
              <button onclick="window.AppAPI.openProtectedFile('${lesson.pdf_url || '#'}', '${lesson.title}')" class="btn-primary-action" style="cursor:pointer; border:none;">
                <i class="fa-solid fa-file-pdf"></i> عرض الملف
              </button>
            </div>
          </div>
        `).join("");
      }
    });

  </script>

</body>
</html>
